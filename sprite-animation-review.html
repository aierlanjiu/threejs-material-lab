<main><small>『律』LÜ · 角色动作</small><h1>沿用原来的完整人物，增加整帧动作</h1>
<p><strong id="actorName">索隆</strong> · 普通演奏、重拍、休止。两边使用相同的人物显示高度。</p>
<div class="toolbar" id="roster" aria-label="选择角色"></div>
<div class="toolbar"><button id="play" disabled>载入中…</button><button data-action="play" aria-pressed="true">普通弹奏</button><button data-action="accent" aria-pressed="false">重拍</button><button data-action="rest" aria-pressed="false">休止</button><button id="slow" aria-pressed="false">慢放</button></div>
<div class="comparison"><figure><canvas id="original" width="640" height="640" aria-label="原四帧动画"></canvas><figcaption><strong>原版</strong>原完整人物 · 4 帧</figcaption></figure><figure><canvas id="expanded" width="640" height="640" aria-label="补充整帧动作"></canvas><figcaption><strong>补帧样片</strong>新增 16 个完整姿态 · 2 组动作</figcaption></figure></div>
<div class="seek"><input id="seek" aria-label="动作时间" type="range" min="0" max="6" step=".0166667" value="0"><output id="time">0.00 s</output></div>
<p class="notice">十位角色均以完整人物逐帧播放，每人新增16个姿态。主站按歌曲时间切换演奏、重拍与休止；本页是无声动作检查。</p>
