<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>律 · 珍珠贝壳音乐厅</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; color: #3d493f; --paper: #f4f1ea; --ink: #3d493f; --radius: 24px; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: var(--paper); -webkit-font-smoothing: antialiased; }
    #stage { position: fixed; inset: 0; background: #acc9c4 center / cover no-repeat; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header { position: fixed; top: max(28px, env(safe-area-inset-top)); left: max(32px, env(safe-area-inset-left)); pointer-events: none; }
    h1 { margin: 0; font: 400 40px/1.2 "Songti SC", "Noto Serif SC", serif; }
    header p { margin: 9px 0 0; font-size: 13px; line-height: 1.7; }
    .toolbar { position: fixed; bottom: max(28px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: var(--radius); background: #f4f1eaf5; box-shadow: 0 3px 18px #344d4620; }
    .views { display: flex; gap: 4px; }
    button { appearance: none; border: 0; border-radius: 20px; background: transparent; min-width: 56px; min-height: 42px; padding: 8px 16px; color: var(--ink); font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
    button[aria-pressed="true"] { background: #dce6dc; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid #486b5a; outline-offset: 3px; }
    @media (hover: hover) { button:hover { background: #e2e7de; } }
    .divider { height: 20px; width: 1px; background: #b8c6b6; margin: 0 4px; }
    #status { position: fixed; bottom: 89px; left: 20px; right: 20px; margin: 0; text-align: center; font-size: 12px; line-height: 1.75; pointer-events: none; }
    #status.error { pointer-events: auto; max-width: 560px; margin: auto; padding: 16px; background: var(--paper); border-radius: 12px; }
    #notice { position: fixed; top: max(28px, env(safe-area-inset-top)); right: max(32px, env(safe-area-inset-right)); margin: 0; font-size: 12px; line-height: 1.8; text-align: right; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      header { top: max(22px, env(safe-area-inset-top)); left: 22px; }
      h1 { font-size: 31px; }
      header p { font-size: 12px; }
      #notice { top: 105px; left: 22px; right: auto; text-align: left; }
      .toolbar { bottom: max(20px, env(safe-area-inset-bottom)); gap: 0; padding: 5px; }
      button { min-width: 48px; padding: 8px 11px; font-size: 12px; }
      .divider { margin: 0 2px; }
      #status { bottom: 80px; }
    }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}</script>
</head>
<body>
  <main id="stage" aria-label="珍珠贝壳音乐厅三维预览"></main>
  <header><h1>律</h1><p>珍珠贝壳音乐厅<br><span lang="en">Pearl shell concert</span></p></header>
  <p id="notice">舞台模型预览<br>角色为现有素材站位示意</p>
  <nav class="toolbar" aria-label="舞台预览控制">
    <div class="views" role="group" aria-label="观察角度">
      <button type="button" data-view="front" aria-pressed="true">正面</button>
      <button type="button" data-view="side" aria-pressed="false">侧面</button>
      <button type="button" data-view="back" aria-pressed="false">背面</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <button type="button" id="castToggle" aria-pressed="true">显示角色</button>
    <button type="button" id="fullScreen" aria-label="全屏预览">全屏</button>
  </nav>
  <p id="status" role="status" aria-live="polite">正在载入舞台…</p>
  <script id="shell-data" type="application/json">/*__SHELL_DATA__*/</script>
  <script type="module">/*__SHELL_MODULE__*/</script>
</body>
</html>
