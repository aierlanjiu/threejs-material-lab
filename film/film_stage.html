<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>『律』乐队模式 · 商业动态短片渲染母版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06090e;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", sans-serif;
    }
    #stageContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    .lu-band-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px !important;
      height: 1080px !important;
    }
    #crossfadeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 5;
    }
    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="stageContainer"></div>
  <canvas id="crossfadeCanvas" width="1920" height="1080"></canvas>
  <canvas id="overlayCanvas" width="1920" height="1080"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/+esm';
    import { createBandScene } from './band-scene-film.js';
    import { compileBandParts, sampleBandEnsemble, bandRoster } from '../js/audio/band-parts.js';
    import { defaultBandSettings } from '../js/ui/band-settings.js';

    const container = document.getElementById('stageContainer');
    const crossfadeCanvas = document.getElementById('crossfadeCanvas');
    const crossfadeCtx = crossfadeCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');

    // Offscreen buffer for 550ms dual-stage crossfade & multi-sample motion blur
    const creamBuffer = document.createElement('canvas');
    creamBuffer.width = 1920;
    creamBuffer.height = 1080;
    const creamCtx = creamBuffer.getContext('2d');

    const accumBuffer = document.createElement('canvas');
    accumBuffer.width = 1920;
    accumBuffer.height = 1080;
    const accumCtx = accumBuffer.getContext('2d');

    // Create scene with exact 1920x1080 rendering dimensions
    const bandScene = await createBandScene(container, { safeTop: 0, safeBottom: 0 });
    bandScene.setCaptureSize(1920, 1080, 1920, 1080);
    await bandScene.configure('one-piece');
    bandScene.setActive(true);
    window.__bandScene = bandScene;

    // Load score json for timing reference
    const scoreRes = await fetch('../assets/band-audio/scores/anime_op_we_are.json');
    const baseScore = await scoreRes.json();
    baseScore.bpmEstimate = 120.0;
    const parts = compileBandParts(baseScore, 'one-piece');

    // Load emblem image
    const emblemImg = new Image();
    emblemImg.src = '../assets/lu-core-emblem.png';
    await new Promise(r => { emblemImg.onload = r; emblemImg.onerror = r; });

    // Director curve helpers
    function clamp(x, a = 0, b = 1) { return Math.max(a, Math.min(b, x)); }
    function smoothstep(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0));
      return t * t * (3 - 2 * t);
    }
    function cubicEaseOut(t) {
      const x = clamp(t, 0, 1);
      return 1 - Math.pow(1 - x, 3);
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpVec(a, b, t) {
      return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
    }

    // --- Build High-Precision Teenage Engineering / Apple Desktop Sandbox Workstation (Act 4) ---
    const workstationGroup = new THREE.Group();
    workstationGroup.visible = false;
    bandScene.scene.add(workstationGroup);

    // 1. Machined dark anodized aluminum chassis & frosted glass tabletop surrounding the water basin
    const chassisOuterGeo = new THREE.RingGeometry(24.2, 42.0, 96);
    const chassisOuterMat = new THREE.MeshStandardMaterial({
      color: 0x161c26,
      roughness: 0.28,
      metalness: 0.88,
      side: THREE.DoubleSide
    });
    const chassisOuterMesh = new THREE.Mesh(chassisOuterGeo, chassisOuterMat);
    chassisOuterMesh.rotation.x = -Math.PI / 2;
    chassisOuterMesh.position.set(0, -0.62, -2.0);
    chassisOuterMesh.receiveShadow = true;
    workstationGroup.add(chassisOuterMesh);

    // 2. Precision champagne-gold bezel ring framing the miniature water lagoon
    const bezelGeo = new THREE.TorusGeometry(24.2, 0.22, 24, 96);
    const bezelMat = new THREE.MeshStandardMaterial({
      color: 0xd8ad72,
      emissive: 0xffb86c,
      emissiveIntensity: 0.35,
      roughness: 0.20,
      metalness: 0.92
    });
    const bezelMesh = new THREE.Mesh(bezelGeo, bezelMat);
    bezelMesh.rotation.x = Math.PI / 2;
    bezelMesh.position.set(0, -0.52, -2.0);
    workstationGroup.add(bezelMesh);

    // 3. Outer glowing telemetry tick ring (64 precision ticks like Teenage Engineering OP-1 / TP-7)
    const tickMat = new THREE.MeshBasicMaterial({ color: 0xffd28a, transparent: true, opacity: 0.65 });
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const isMajor = (i % 4 === 0);
      const tickLen = isMajor ? 0.95 : 0.45;
      const tickW = isMajor ? 0.12 : 0.06;
      const tickGeo = new THREE.BoxGeometry(tickW, 0.04, tickLen);
      const tick = new THREE.Mesh(tickGeo, tickMat);
      const r = 25.4 + tickLen * 0.5;
      tick.position.set(Math.cos(a) * r, -0.58, -2.0 + Math.sin(a) * r);
      tick.rotation.y = -a + Math.PI / 2;
      workstationGroup.add(tick);
    }

    // 4. Right-side Floating Crystal Music Cube with Golden Core & Pedestal
    const pedGeo = new THREE.CylinderGeometry(2.2, 2.5, 0.35, 48);
    const pedMat = new THREE.MeshStandardMaterial({ color: 0x222b38, roughness: 0.25, metalness: 0.9 });
    const pedMesh = new THREE.Mesh(pedGeo, pedMat);
    pedMesh.position.set(20.5, -0.45, 5.2);
    workstationGroup.add(pedMesh);

    const pedRingGeo = new THREE.TorusGeometry(2.35, 0.06, 16, 48);
    const pedRing = new THREE.Mesh(pedRingGeo, bezelMat);
    pedRing.rotation.x = Math.PI / 2;
    pedRing.position.set(20.5, -0.32, 5.2);
    workstationGroup.add(pedRing);

    const cubeGroup = new THREE.Group();
    cubeGroup.position.set(20.5, 2.5, 5.2);
    workstationGroup.add(cubeGroup);

    const cubeGeo = new THREE.BoxGeometry(2.6, 2.6, 2.6);
    const cubeMat = new THREE.MeshPhysicalMaterial({
      color: 0xe6f2ff,
      transmission: 0.85,
      opacity: 1,
      transparent: true,
      roughness: 0.08,
      metalness: 0.05,
      ior: 1.52,
      thickness: 2.0,
      clearcoat: 1.0
    });
    const cubeMesh = new THREE.Mesh(cubeGeo, cubeMat);
    cubeGroup.add(cubeMesh);

    // Wireframe gold edges on the Music Cube
    const edgesGeo = new THREE.EdgesGeometry(cubeGeo);
    const edgesMat = new THREE.LineBasicMaterial({ color: 0xffd28a, transparent: true, opacity: 0.75 });
    const cubeEdges = new THREE.LineSegments(edgesGeo, edgesMat);
    cubeGroup.add(cubeEdges);

    // Inner glowing octahedron core inside cube
    const coreGeo = new THREE.OctahedronGeometry(0.85, 1);
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0xfff0d0,
      emissive: 0xffaa44,
      emissiveIntensity: 1.8,
      roughness: 0.15
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    cubeGroup.add(coreMesh);

    // 5. Left-side Teenage Engineering style Rotary Tactile Encoder Dial & Level Faders
    const dialBaseGeo = new THREE.CylinderGeometry(2.1, 2.3, 0.45, 48);
    const dialBase = new THREE.Mesh(dialBaseGeo, pedMat);
    dialBase.position.set(-20.5, -0.40, 5.2);
    workstationGroup.add(dialBase);

    const knobGeo = new THREE.CylinderGeometry(1.45, 1.45, 0.85, 48);
    const knobMat = new THREE.MeshStandardMaterial({ color: 0xd8ad72, roughness: 0.24, metalness: 0.88 });
    const knobMesh = new THREE.Mesh(knobGeo, knobMat);
    knobMesh.position.set(-20.5, 0.15, 5.2);
    workstationGroup.add(knobMesh);

    // Helper: Convert 3D world coordinates to 2D 1920x1080 screen coordinates
    function worldToScreen(x, y, z) {
      const v = new THREE.Vector3(x, y, z);
      v.project(bandScene.camera);
      return {
        x: (v.x * 0.5 + 0.5) * 1920,
        y: (-(v.y * 0.5) + 0.5) * 1080
      };
    }

    // Core pure state evaluation at continuous time `t`
    function evaluateSceneAtTime(time, lookOverride = null) {
      const film = {
        camera: null,
        solo: null,
        bed: 0,
        physics: {},
        positions: {},
        muted: {},
        wings: { power: 0, spread: 0, dissolve: 0 },
        wingsFor: {},
        ripples: [],
        beat: { pulse: 0, downbeat: 0 },
        labels: {},
        exposure: 1.0,
        formation: { from: 'arc', to: 'arc', mix: 1 },
      };

      // Beat tracking (120 BPM: 0.500s per beat)
      const beatProgress = (time % 0.5) / 0.5;
      const beatIndex = Math.floor(time / 0.5);
      film.beat.pulse = Math.exp(-beatProgress * 8.0);
      film.beat.downbeat = (beatIndex % 4 === 0) ? film.beat.pulse : 0;

      let stageLook = lookOverride || 'cream';

      // --- ACT 1: 0.0 - 6.0s (Awakening & Miniature Entrance) ---
      if (time < 6.0) {
        stageLook = lookOverride || 'cream';
        workstationGroup.visible = false;

        if (time < 0.5) {
          // 0.0 - 0.5s: Macro close-up hook on morning jade steps, shimmering lake, Marimba (Chopper) & Saxophone (Ace)
          const tHook = smoothstep(0.0, 0.5, time);
          const camPos = lerpVec([4.8, 3.8, 12.6], [4.2, 4.1, 13.4], tHook);
          const camTgt = lerpVec([3.6, 1.15, 4.6], [3.0, 1.2, 4.5], tHook);
          film.camera = { position: camPos, target: camTgt, fov: 26.5 };
        } else {
          // 0.5 - 6.0s: 30-degree cinematic dolly sweeping past Chopper (Marimba) & Ace (Saxophone) to establish the ensemble
          const tPan = smoothstep(0.5, 5.8, time);
          const camPos = lerpVec([4.2, 4.1, 13.4], [-1.2, 8.2, 21.8], tPan);
          const camTgt = lerpVec([3.0, 1.2, 4.5], [-0.8, 1.35, 4.2], tPan);
          const fov = lerp(26.5, 29.2, tPan);
          film.camera = { position: camPos, target: camTgt, fov };
        }
      }

      // --- ACT 2: 6.0 - 14.0s (Tactile Micro-interactions & Spatial Panning) ---
      else if (time >= 6.0 && time < 14.0) {
        stageLook = lookOverride || 'cream';
        workstationGroup.visible = false;

        // Smooth camera choreography across the 3 tactile interactions
        if (time < 7.4) {
          // Framed on Left Wing: Sanji (drums at [-8.0, 5.19]) & Zoro (bass at [-4.0, 7.36])
          const tCam1 = smoothstep(6.0, 6.8, time);
          film.camera = {
            position: lerpVec([-1.2, 8.2, 21.8], [-3.8, 7.4, 19.6], tCam1),
            target: lerpVec([-0.8, 1.35, 4.2], [-4.8, 1.25, 5.2], tCam1),
            fov: 28.5
          };
        } else if (time < 9.5) {
          // Zooming into Zoro for the 95 lux spotlight Solo Lock-on
          const tCam2 = smoothstep(7.4, 8.1, time);
          film.camera = {
            position: lerpVec([-3.8, 7.4, 19.6], [-3.2, 6.2, 16.8], tCam2),
            target: lerpVec([-4.8, 1.25, 5.2], [-3.8, 1.65, 6.8], tCam2),
            fov: lerp(28.5, 27.0, tCam2)
          };
        } else {
          // Pulling out to full interactive sandbox view as Luffy is dragged from Left-Back to Right-Front
          const tCam3 = smoothstep(9.5, 11.2, time);
          film.camera = {
            position: lerpVec([-3.2, 6.2, 16.8], [0.0, 8.6, 22.4], tCam3),
            target: lerpVec([-3.8, 1.65, 6.8], [0.4, 1.35, 4.4], tCam3),
            fov: lerp(27.0, 29.8, tCam3)
          };
        }

        // 1. Tap Sanji (Drums) to Rest (6.0 - 9.5s: 4-bar / phrasing rest)
        if (time >= 6.0) {
          const muteIn = smoothstep(6.0, 6.22, time);
          const muteOut = smoothstep(12.2, 12.6, time);
          film.muted['sanji'] = muteIn * (1.0 - muteOut);
        }

        // 2. Hold Zoro (Bass) to Solo (7.4 - 9.5s)
        if (time >= 7.4 && time < 9.5) {
          const soloProgress = smoothstep(7.4, 7.72, time) * (1.0 - smoothstep(9.18, 9.5, time));
          film.solo = { id: 'zoro', power: soloProgress };
          film.bed = soloProgress * 0.92;
          film.labels['zoro'] = soloProgress;
        }

        // 3. Drag Luffy (Vocals) from Left-Back [-4.5, 1.2] to Right-Front [+4.5, 6.4] (9.5 - 14.0s)
        // Before 9.5s, transition Luffy smoothly to starting drag point [-4.5, 1.2] while camera is on Zoro
        if (time >= 7.5 && time < 9.5) {
          const tPrep = smoothstep(7.5, 9.4, time);
          film.positions['luffy'] = [lerp(0.0, -4.5, tPrep), lerp(8.0, 1.2, tPrep)];
        } else if (time >= 9.5 && time < 12.0) {
          const tDrag = smoothstep(9.5, 12.0, time);
          const curLuffyX = lerp(-4.5, 4.5, tDrag);
          const curLuffyZ = lerp(1.2, 6.4, tDrag);
          film.positions['luffy'] = [curLuffyX, curLuffyZ];

          // Physical hover lift (+0.24) + velocity-coupled tilt inertia
          const lift = smoothstep(9.5, 9.75, time) * 0.24;
          const velocityProfile = Math.sin(tDrag * Math.PI);
          const tiltZ = -0.18 * velocityProfile;
          const tiltX = 0.09 * velocityProfile;
          film.physics['luffy'] = { lift, tiltX, tiltZ, landing: 0 };
          film.labels['luffy'] = smoothstep(9.5, 9.8, time) * (1.0 - smoothstep(11.7, 12.0, time));
        } else if (time >= 12.0) {
          // 12.0s: Release -> 2nd-order underdamped spring landing bounce & concentric shockwave
          const landAge = time - 12.0;
          film.positions['luffy'] = [4.5, 6.4];
          if (landAge < 1.35) {
            const landingPulse = Math.exp(-landAge * 6.8) * Math.cos(landAge * 24.0);
            film.physics['luffy'] = { lift: 0, tiltX: 0, tiltZ: 0, landing: landingPulse };
            film.ripples.push({
              x: 4.5, z: 6.4, age: landAge, power: Math.max(0, 1.0 - landAge / 0.95), size: 6.2, color: '#ffd28a', rings: 4
            });
          }
        }
      }

      // --- ACT 3: 14.0 - 23.0s (Stage Metamorphosis & Grand Climax) ---
      else if (time >= 14.0 && time < 23.0) {
        stageLook = lookOverride || 'island';
        workstationGroup.visible = false;

        // Formation transforms from 'arc' to 'terrace' during the snare roll buildup (14.0 - 16.5s)
        film.formation = {
          from: 'arc',
          to: 'terrace',
          mix: smoothstep(14.0, 16.2, time)
        };

        if (time < 17.5) {
          // 14.0 - 17.5s: Dramatic camera push & orbital sweep during Snare Roll Crescendo
          const tBuild = smoothstep(14.0, 17.5, time);
          const camPos = lerpVec([0.0, 8.6, 22.4], [-3.2, 8.8, 24.5], tBuild);
          const camTgt = lerpVec([0.4, 1.35, 4.4], [0.0, 2.7, 2.2], tBuild);
          film.camera = { position: camPos, target: camTgt, fov: lerp(29.8, 31.2, tBuild) };
        } else {
          // 17.5 - 23.0s: Grand Climax Full-Stage Panorama!
          // Camera glides across at a 28-degree theater angle capturing sky airbursts, 8 stage fountains, particle wings & water reflections
          const tClimax = (time - 17.5) / 5.5;
          const camX = lerp(-3.2, 3.6, smoothstep(0.0, 1.0, tClimax));
          const camY = lerp(8.8, 9.4, smoothstep(0.0, 0.7, tClimax));
          const camZ = lerp(24.5, 25.8, smoothstep(0.0, 1.0, tClimax));
          film.camera = { position: [camX, camY, camZ], target: [0.0, 2.9, 1.8], fov: 31.8 };
        }

        // Climax Particle Wings & Stage Glow (17.5s - 22.2s)
        if (time >= 17.5 && time < 22.5) {
          const climaxAge = time - 17.5;
          const wingIn = smoothstep(0.0, 0.38, climaxAge);
          const dissolve = smoothstep(3.8, 4.8, climaxAge);
          const wingPower = wingIn * (1.0 - dissolve);
          film.wings = { power: wingPower, spread: smoothstep(0.0, 0.45, climaxAge), dissolve };
          film.glow = 1.38;
          film.exposure = 1.08;
        } else {
          film.glow = 1.0;
        }
      }

      // --- ACT 4: 23.0 - 30.0s (Sandbox Reveal & Brand Lockup) ---
      else if (time >= 23.0) {
        stageLook = lookOverride || 'island';
        workstationGroup.visible = true;
        film.formation = { from: 'terrace', to: 'terrace', mix: 1 };

        // Camera smoothly elevates & pulls back to reveal the entire miniature island sandbox on the 『律』 desktop workstation
        const tReveal = smoothstep(23.0, 26.8, time);
        const camPos = lerpVec([3.6, 9.4, 25.8], [0.0, 16.5, 36.5], tReveal);
        const camTgt = lerpVec([0.0, 2.9, 1.8], [0.0, 2.2, 0.0], tReveal);
        const fov = lerp(31.8, 32.5, tReveal);
        film.camera = { position: camPos, target: camTgt, fov };

        // Animate desktop workstation props
        cubeGroup.rotation.y = time * 0.55;
        cubeGroup.rotation.x = Math.sin(time * 0.7) * 0.16;
        cubeGroup.position.y = 2.4 + Math.sin(time * 1.4) * 0.22;
        knobMesh.rotation.y = -time * 0.4;
      }

      const activeScore = {
        ...baseScore,
        duration: 30.0,
        stageCues: {
          choruses: [{ start: 17.5, end: 21.6 }],
          bursts: [17.5, 18.22, 19.10],
          source: 'film'
        }
      };

      const ensembleSample = sampleBandEnsemble(activeScore, parts, time, film.solo?.id || null);

      // Ensure rich animated instrument motion in Act 1 & Climax
      if (time >= 0.5 && time < 6.0) {
        ensembleSample.parts.forEach((p, idx) => {
          const wakeDelay = 0.5 + (idx % 5) * 0.22;
          if (time >= wakeDelay) {
            p.activity = Math.max(p.activity, 0.68 + 0.24 * Math.sin(time * 4.0 + idx));
            p.energy = Math.max(p.energy, 0.65);
            if (beatProgress < 0.18) p.attack = Math.max(p.attack, 0.78);
          }
        });
      } else if (time >= 17.5 && time < 21.5) {
        ensembleSample.parts.forEach(p => {
          p.activity = Math.max(0.95, p.activity * 1.4);
          p.energy = Math.max(0.92, p.energy * 1.35);
          p.attack = Math.max(0.82, p.attack * 1.5);
        });
      }

      bandScene.update(ensembleSample, {
        settings: {
          ...defaultBandSettings(),
          preset: 'concert',
          stageLook,
          formation: film.formation.to,
          lightMode: 'multi',
          contrast: true,
          effects: 'auto',
          overrides: {}
        },
        score: activeScore,
        parts,
        film
      });

      return { film, stageLook };
    }

    // Global Director API for headless Playwright render
    window.renderFilmFrame = async function(frameIndex, totalFrames = 900) {
      const time = frameIndex / 30.0; // Exact 0.000s to 29.967s
      crossfadeCtx.clearRect(0, 0, 1920, 1080);
      overlayCtx.clearRect(0, 0, 1920, 1080);

      // Determine if we are in the 550ms Dual-Stage Look Crossfade (14.00s - 14.55s)
      if (time >= 14.0 && time <= 14.55) {
        const mix = cubicEaseOut((time - 14.0) / 0.55);
        // 1. Render 'cream' stage to offscreen buffer
        evaluateSceneAtTime(time, 'cream');
        creamCtx.clearRect(0, 0, 1920, 1080);
        creamCtx.drawImage(bandScene.canvas, 0, 0, 1920, 1080);

        // 2. Render 'island' stage to main WebGL canvas
        evaluateSceneAtTime(time, 'island');

        // 3. Draw fading 'cream' snapshot over 'island' canvas for a seamless 550ms crossfade
        crossfadeCtx.save();
        crossfadeCtx.globalAlpha = 1.0 - mix;
        crossfadeCtx.drawImage(creamBuffer, 0, 0, 1920, 1080);
        crossfadeCtx.restore();

        // Subtle golden horizon sweep flash at the midpoint of metamorphosis
        const flashAlpha = Math.sin(mix * Math.PI) * 0.22;
        if (flashAlpha > 0.01) {
          const grad = crossfadeCtx.createLinearGradient(0, 0, 1920, 1080);
          grad.addColorStop(0, `rgba(255, 220, 150, 0)`);
          grad.addColorStop(mix, `rgba(255, 210, 138, ${flashAlpha})`);
          grad.addColorStop(1, `rgba(255, 160, 90, 0)`);
          crossfadeCtx.fillStyle = grad;
          crossfadeCtx.fillRect(0, 0, 1920, 1080);
        }
      }
      // Determine if we are in high-speed camera motion or climax pyro (multi-sample 4-substep motion blur, 270° shutter)
      else if ((time >= 9.6 && time < 11.9) || (time >= 17.5 && time < 21.5) || (time >= 23.2 && time < 26.2)) {
        const substeps = 4;
        const shutterSec = (1.0 / 30.0) * 0.75; // 270-degree shutter
        accumCtx.clearRect(0, 0, 1920, 1080);
        for (let s = 0; s < substeps; s++) {
          const subTime = Math.max(0, time - shutterSec * (1.0 - (s / (substeps - 1))));
          evaluateSceneAtTime(subTime);
          accumCtx.save();
          accumCtx.globalAlpha = 1.0 / (s + 1);
          accumCtx.drawImage(bandScene.canvas, 0, 0, 1920, 1080);
          accumCtx.restore();
        }
        // Final state at exact `time` for accurate member projections
        evaluateSceneAtTime(time);
        crossfadeCtx.drawImage(accumBuffer, 0, 0, 1920, 1080);
      } else {
        evaluateSceneAtTime(time);
      }

      // Query exact 2D screen projections of all band members
      const projections = bandScene.memberProjections;
      const projById = {};
      for (const p of projections) {
        const shortId = p.id.split('/')[1];
        projById[shortId] = {
          ...p,
          screenX: (p.centerNdc.x * 0.5 + 0.5) * 1920,
          screenY: (-(p.centerNdc.y * 0.5) + 0.5) * 1080,
          footX: (p.footNdc.x * 0.5 + 0.5) * 1920,
          footY: (-(p.footNdc.y * 0.5) + 0.5) * 1080
        };
      }

      // --- 2D Retina Tactile & Cinematic Overlays ---
      // Tilt-Shift shallow depth-of-field optical vignette
      if (time < 24.5) {
        const dofAlpha = time < 23.0 ? 1.0 : 1.0 - smoothstep(23.0, 24.5, time);
        drawCinematicBokehOverlay(overlayCtx, time, dofAlpha);
      }

      // Act 1: Play Capsule & Finger Awakening (0.0 - 1.2s)
      if (time < 1.25) {
        const capX = 960, capY = 580;
        if (time < 0.85) {
          const capAlpha = 1.0 - smoothstep(0.50, 0.82, time);
          const capScale = time < 0.5 ? 1.0 : 1.0 + smoothstep(0.5, 0.8, time) * 0.18;
          drawPlayCapsule(overlayCtx, capX, capY, capAlpha, capScale);
        }
        const tC = smoothstep(0.05, 0.50, time);
        const fadeOut = 1.0 - smoothstep(0.85, 1.20, time);
        if (fadeOut > 0.01) {
          const curX = lerp(780, capX, tC);
          const curY = lerp(860, capY, tC);
          const clickScale = (time >= 0.46 && time <= 0.62) ? 0.80 : 1.0;
          overlayCtx.save();
          overlayCtx.globalAlpha = fadeOut;
          drawCursor(overlayCtx, curX, curY, clickScale, time >= 0.48 && time <= 0.65);
          overlayCtx.restore();
        }
        if (time >= 0.50) {
          drawAwakeningRipple(overlayCtx, capX, capY, (time - 0.50) / 0.68);
        }
      }

      // Act 2 Interaction 1: Tap Sanji (Drums) to Rest (5.6 - 7.3s)
      if (time >= 5.6 && time < 7.4 && projById['sanji']) {
        const sanji = projById['sanji'];
        const tTap = smoothstep(5.6, 6.0, time);
        const curX = lerp(960, sanji.screenX, tTap);
        const curY = lerp(580, sanji.screenY, tTap);
        const press = (time >= 5.95 && time <= 6.18) ? 0.78 : 1.0;
        drawCursor(overlayCtx, curX, curY, press);
        if (time >= 6.0) {
          drawTapRipple(overlayCtx, sanji.screenX, sanji.screenY, (time - 6.0) / 0.55);
          const badgeAlpha = smoothstep(6.0, 6.2, time) * (1.0 - smoothstep(7.0, 7.35, time));
          drawTactilePill(overlayCtx, sanji.screenX, sanji.screenY - 125, '山治 · 休止 4小节', 'rgba(130, 165, 185, 0.85)', badgeAlpha);
        }
      }

      // Act 2 Interaction 2: Long-Press Zoro (Bass) for 95 lux Solo (7.35 - 9.5s)
      if (time >= 7.35 && time < 9.5 && projById['zoro']) {
        const zoro = projById['zoro'];
        const sanji = projById['sanji'] || { screenX: 420, screenY: 520 };
        const tMove = smoothstep(7.35, 7.65, time);
        const curX = lerp(sanji.screenX, zoro.screenX, tMove);
        const curY = lerp(sanji.screenY, zoro.screenY, tMove);
        const isHolding = time >= 7.65 && time <= 9.35;
        drawCursor(overlayCtx, curX, curY, isHolding ? 0.82 : 1.0, isHolding);
        if (time >= 7.55) {
          const soloPower = smoothstep(7.55, 7.85, time) * (1.0 - smoothstep(9.2, 9.5, time));
          drawSoloChargeRing(overlayCtx, zoro.screenX, zoro.screenY, soloPower, time);
          drawTactilePill(overlayCtx, zoro.screenX, zoro.screenY + 115, '索隆 · 独奏锁定 (95 lux)', 'rgba(255, 210, 138, 0.92)', soloPower);
        }
      }

      // Act 2 Interaction 3: Drag Luffy from Left-Back to Right-Front + Spatial Panning + Spring Landing (9.5 - 13.2s)
      if (time >= 9.5 && time < 13.2 && projById['luffy']) {
        const luffy = projById['luffy'];
        if (time < 12.0) {
          const tDrag = smoothstep(9.5, 12.0, time);
          drawCursor(overlayCtx, luffy.screenX, luffy.screenY + 10, 0.80, true);
          drawSpatialSweepHUD(overlayCtx, luffy.screenX, luffy.screenY, tDrag);
        } else {
          const landAge = time - 12.0;
          const fadeCursor = 1.0 - smoothstep(0.0, 0.45, landAge);
          if (fadeCursor > 0.01) {
            overlayCtx.save();
            overlayCtx.globalAlpha = fadeCursor;
            drawCursor(overlayCtx, luffy.screenX, luffy.screenY, 1.05, false);
            overlayCtx.restore();
          }
          if (landAge < 1.0) {
            drawSpatialSweepHUD(overlayCtx, luffy.screenX, luffy.screenY, 1.0, 1.0 - smoothstep(0.5, 1.0, landAge));
          }
        }
      }

      // Act 4: Brand Lockup & Retina Nameplate (26.5 - 30.0s)
      if (time >= 26.5) {
        const brandAlpha = smoothstep(26.5, 27.4, time);
        drawBrandLockup(overlayCtx, brandAlpha, emblemImg, time);
      }

      return true;
    };

    // --- Retina Overlay Drawing Helpers ---
    function drawPlayCapsule(ctx, cx, cy, alpha, scale = 1.0) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 8;
      ctx.fillStyle = 'rgba(18, 28, 38, 0.68)';
      ctx.strokeStyle = 'rgba(255, 210, 138, 0.82)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(-105, -34, 210, 68, 34);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Play icon + label
      ctx.fillStyle = '#ffd28a';
      ctx.beginPath();
      ctx.moveTo(-58, -13);
      ctx.lineTo(-34, 0);
      ctx.lineTo(-58, 13);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f5ecde';
      ctx.font = '500 22px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('唤醒剧场', -18, 8);
      ctx.restore();
    }

    function drawAwakeningRipple(ctx, cx, cy, progress) {
      if (progress >= 1.0 || progress < 0) return;
      ctx.save();
      const inv = 1.0 - progress;
      ctx.strokeStyle = `rgba(255, 210, 138, ${inv * 0.9})`;
      ctx.lineWidth = 3.2 * inv;
      ctx.beginPath();
      ctx.arc(cx, cy, 30 + progress * 110, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 14; i++) {
        const angle = (i / 14) * Math.PI * 2 + progress * 0.6;
        const dist = 35 + progress * 125 + (i % 3) * 12;
        const px = cx + Math.cos(angle) * dist;
        const py = cy + Math.sin(angle) * dist;
        ctx.fillStyle = `rgba(255, 235, 190, ${inv * 0.95})`;
        ctx.beginPath();
        ctx.arc(px, py, 3.0 * inv, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawCursor(ctx, x, y, scale = 1.0, isActive = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 5;
      ctx.fillStyle = isActive ? 'rgba(255, 210, 138, 0.96)' : 'rgba(255, 255, 255, 0.94)';
      ctx.beginPath();
      ctx.arc(0, 0, isActive ? 15 : 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = isActive ? 'rgba(255, 230, 175, 0.78)' : 'rgba(255, 255, 255, 0.52)';
      ctx.lineWidth = 3.0;
      ctx.beginPath();
      ctx.arc(0, 0, isActive ? 25 : 20, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawTapRipple(ctx, x, y, progress) {
      if (progress >= 1.0 || progress < 0) return;
      ctx.save();
      const inv = 1.0 - progress;
      ctx.strokeStyle = `rgba(145, 185, 205, ${inv * 0.9})`;
      ctx.lineWidth = 3.5 * inv;
      ctx.beginPath();
      ctx.arc(x, y, 16 + progress * 85, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawSoloChargeRing(ctx, x, y, power, time) {
      if (power <= 0.01) return;
      ctx.save();
      ctx.strokeStyle = `rgba(255, 210, 138, ${power * 0.9})`;
      ctx.lineWidth = 3.0;
      ctx.setLineDash([10, 7]);
      ctx.lineDashOffset = -time * 36;
      ctx.beginPath();
      ctx.arc(x, y, 42 + Math.sin(time * 8) * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawTactilePill(ctx, x, y, text, borderColor, alpha) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = '500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      const w = Math.max(220, ctx.measureText(text).width + 48);
      const h = 44;
      const rx = clamp(x - w / 2, 40, 1880 - w);
      const ry = clamp(y - h / 2, 40, 1020 - h);
      ctx.fillStyle = 'rgba(12, 18, 26, 0.84)';
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(rx, ry, w, h, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#f5ecde';
      ctx.textAlign = 'center';
      ctx.fillText(text, rx + w / 2, ry + 29);
      ctx.restore();
    }

    function drawSpatialSweepHUD(ctx, x, y, progress, alpha = 1.0) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      const panNum = -0.85 + 1.70 * progress;
      const panStr = (panNum >= 0 ? '+' : '') + panNum.toFixed(2);
      const eqStr = progress < 0.35 ? 'LPF 3.2kHz · 远场深处' : progress > 0.65 ? 'Hi-Shelf +3.5dB · 近场通透' : '过渡均衡 · 舞台中轴';

      // Draw sleek telemetry pill above dragged character
      const w = 340, h = 62;
      const px = clamp(x - w / 2, 60, 1860 - w);
      const py = clamp(y - 175, 50, 960);

      ctx.fillStyle = 'rgba(12, 18, 26, 0.86)';
      ctx.strokeStyle = 'rgba(255, 210, 138, 0.72)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(px, py, w, h, 18);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffd28a';
      ctx.font = '600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`空间声相 Pan ${panStr}  ·  抬升 +0.24`, px + w / 2, py + 26);

      ctx.fillStyle = 'rgba(220, 232, 245, 0.85)';
      ctx.font = '400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      ctx.fillText(eqStr, px + w / 2, py + 48);
      ctx.restore();
    }

    function drawCinematicBokehOverlay(ctx, time, alpha = 1.0) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      const grad = ctx.createLinearGradient(0, 0, 0, 1080);
      grad.addColorStop(0.0, 'rgba(6, 10, 16, 0.34)');
      grad.addColorStop(0.14, 'rgba(6, 10, 16, 0.0)');
      grad.addColorStop(0.86, 'rgba(6, 10, 16, 0.0)');
      grad.addColorStop(1.0, 'rgba(6, 10, 16, 0.42)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.restore();
    }

    function drawBrandLockup(ctx, alpha, emblem, time) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      // Subtle top-half atmospheric scrim so the miniature performers remain clearly visible below
      const scrim = ctx.createRadialGradient(960, 260, 40, 960, 260, 560);
      scrim.addColorStop(0.0, 'rgba(10, 15, 24, 0.62)');
      scrim.addColorStop(0.65, 'rgba(10, 15, 24, 0.24)');
      scrim.addColorStop(1.0, 'rgba(10, 15, 24, 0.0)');
      ctx.fillStyle = scrim;
      ctx.fillRect(0, 0, 1920, 620);

      const cx = 960, cy = 220;

      // Glowing emblem in upper sky area
      if (emblem && emblem.complete) {
        const ew = 116, eh = 116;
        ctx.shadowColor = 'rgba(255, 210, 138, 0.72)';
        ctx.shadowBlur = 32;
        ctx.drawImage(emblem, cx - ew / 2, cy - 115, ew, eh);
        ctx.shadowBlur = 0;
      }

      // Title: 『 律 』 L Ü
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 48px "Noto Serif SC", "PingFang SC", serif';
      ctx.letterSpacing = '12px';
      ctx.fillText('『 律 』  L Ü', cx, cy + 52);

      // High-Precision Retina Nameplate (768x144 scaled 0.58x for crisp 2x supersampled typography)
      const npW = 768, npH = 144;
      const scale = 0.58;
      ctx.save();
      ctx.translate(cx, cy + 122);
      ctx.scale(scale, scale);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 8;
      ctx.fillStyle = 'rgba(14, 20, 30, 0.88)';
      ctx.strokeStyle = 'rgba(255, 210, 138, 0.68)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(-npW / 2, -npH / 2, npW, npH, 72);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffd28a';
      ctx.font = '600 42px "Noto Serif SC", "PingFang SC", sans-serif';
      ctx.letterSpacing = '8px';
      ctx.fillText('乐队模式 · 全新上线', 0, -4);

      ctx.fillStyle = 'rgba(225, 235, 245, 0.82)';
      ctx.font = '500 22px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      ctx.letterSpacing = '5px';
      ctx.fillText('DESKTOP MINIATURE AUDIOVISUAL THEATER', 0, 42);
      ctx.restore();

      ctx.restore();
    }

    window.__stageReady = true;
    console.log('[*] Film stage loaded and ready for rendering!');
  </script>
