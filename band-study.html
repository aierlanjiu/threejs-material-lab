<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>律 · 乐队舞台</title><link rel="stylesheet" href="./css/lu-instrument-study.css"><link rel="stylesheet" href="./css/lu-band.css"></head>
<body><main class="band-study"><header><a href="./index.html?intro=skip">← 返回律</a><h1>乐队舞台</h1><p>全主题乐队 · 独立器乐动作 · 五种立方编排</p></header>
<div class="band-study-toolbar"><select id="bandTheme" aria-label="动漫主题"><option value="one-piece">海贼王</option><option value="dragon-ball">龙珠</option><option value="naruto">火影忍者</option></select><select id="bandTrack" aria-label="演出曲目"><option value="demo">编排演示 · 未绑定歌曲</option></select></div>
<section class="band-study-stage" aria-label="全成员乐队舞台"><div id="bandStudyScene" class="lu-band-scene"></div><section class="lu-band-score" aria-label="声部乐谱"><div class="lu-band-score-heading"><strong id="bandScoreTitle">主旋律</strong><small id="bandScoreSource">演示谱</small></div><canvas id="bandScoreCanvas" role="img" aria-label="随时间轴推进的声部谱面"></canvas></section><div id="bandStatus" class="lu-band-status" aria-live="polite">编排演示 · 未绑定当前歌曲</div><small class="band-study-score-note">谱窗为时间轴预览；完整音高见 MIDI / MusicXML</small></section>
<div id="bandStudyControls"></div>
<div class="band-study-transport"><button id="bandPlay" type="button">开始演示</button><input id="bandSeek" type="range" min="0" max="32" step=".05" value="0" aria-label="演出进度"><span id="bandTime">00:00 / 00:32</span><select id="bandListen" aria-label="试听声部"><option value="mix">完整混音</option><option value="vocals">人声</option><option value="bass">低音</option><option value="drums">鼓</option><option value="other">共享伴奏</option></select></div>
<div id="bandDownloads" class="band-study-links"></div><p class="band-study-note">点击角色只改变视觉焦点；声部试听由右侧选择。独立音轨与共享音轨分别标示；成员分谱属于演出编配。真实曲目的谱面为自动转写，需人工校谱。免责声明：本实验仅供 WebGL 物理材质与音频可视化非商业技术研究，曲目及角色版权归原作者与出品方所有。<a href="./DISCLAIMER.md" target="_blank" style="color:#dcd6cb;text-decoration:underline;margin-left:4px;">查看完整免责声明</a></p><audio id="bandAudio" preload="metadata" hidden></audio></main><script type="module" src="./js/ui/band-study.js"></script></body></html>
